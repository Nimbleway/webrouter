site_name: web-router Documentation
site_description: One interface over many web search, extraction, research and browser APIs
repo_url: https://github.com/WebContextLayer/webrouter
repo_name: WebContextLayer/webrouter
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Adding a Provider: guides/adding-a-provider.md
    - Promoting an Option: guides/promoting-an-option.md
    - Plugin vs Catalogue: guides/plugin-vs-catalogue.md
  - Contract:
    - Overview: contract/README.md
  - Integrators:
    - Framework Integration: integrators/frameworks.md
  - Agents:
    - MCP Server: mcp.md
    - Baseline Agent Prompt: agent-prompt.md
