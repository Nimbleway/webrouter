name: CI

# Runs on every push and pull request. No secrets are used anywhere in this
# workflow: integration tests are deselected, so a fork PR gets the same
# signal as a branch on this repository.
#
# The full set (every supported Python, the import, hygiene and build checks)
# runs only for main: pushes to it and pull requests into it. Anything else, such
# as a pull request into an integration branch, runs one job, `CI`: lint, types
# and the unit tests on the oldest supported Python, plus the credential scan.

on:
  push:
    branches: [main, phase-2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # fail if uv.lock is out of date rather than silently resolving
  FULL: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}

jobs:
  lint:
    name: Lint and types
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev

      - name: Unit tests
        # "not integration" keeps every test that needs a live API key out of CI, and
        # "not browser" every test that launches a real local Chrome.
        run: uv run pytest -m "not integration and not browser" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  import-without-extras:
    name: Imports with no providers installed
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the base package only
        # A venv, not --system: the runner's Python is externally managed (PEP 668).
        run: |
          uv venv /tmp/base
          uv pip install --python /tmp/base/bin/python .

      - name: Base import must not require any provider SDK
        # Providers are optional extras and resolve lazily. Importing the
        # package, listing providers and building a router must all work
        # without any SDK installed; only reaching for one may fail, and it
        # must fail with an actionable error rather than an ImportError.
        run: |
          /tmp/base/bin/python - <<'PY'
          import web_router
          from web_router.providers import SearchProvider  # must not pull in httpx

          assert "tavily" in web_router.available_providers()
          router = web_router.WebRouter("tavily")  # lazy: no SDK needed yet

          try:
              router.search("anything")
          except web_router.ProviderNotInstalledError as exc:
              print(f"correctly reported: {exc}")
          else:
              raise SystemExit("expected ProviderNotInstalledError without the extra installed")

          # The default provider is `auto`, whose members are all optional too.
          # With nothing installed it must still fail actionably rather than
          # with an ImportError from inside the chain.
          try:
              web_router.WebRouter().search("anything")
          except web_router.ProviderNotInstalledError as exc:
              print(f"auto correctly reported: {exc}")
          else:
              raise SystemExit("expected auto to report a missing extra")

          # HttpSearchProvider needs httpx, so it must stay deferred here.
          try:
              web_router.providers.HttpSearchProvider
          except (AttributeError, ModuleNotFoundError):
              print("HttpSearchProvider correctly deferred")
          else:
              raise SystemExit("HttpSearchProvider imported httpx into the base package")
          PY

  hygiene:
    name: Repo hygiene
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: pre-commit
        env:
          # A local guard against committing straight to main; meaningless here,
          # where CI is running against exactly that branch.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: requirements files are in sync with uv.lock
        # The generated header records the output path, so compare pins only.
        run: |
          uv export --no-hashes --no-emit-project --all-extras --no-dev -o /tmp/requirements.txt
          uv export --no-hashes --no-emit-project --all-extras --only-dev -o /tmp/requirements-dev.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt) \
            || { echo "::error::requirements.txt is stale. Run: make requirements"; exit 1; }
          diff -u <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.txt) \
            || { echo "::error::requirements-dev.txt is stale. Run: make requirements"; exit 1; }

      - name: No .env file committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi

      - name: No credentials in tracked files
        run: bash scripts/check_credentials.sh

  build:
    name: Build and verify package
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build
      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Wheel ships the type marker
        run: |
          unzip -l dist/*.whl | grep -q 'web_router/py.typed' \
            || { echo "::error::py.typed missing from the wheel"; exit 1; }

      - name: Installs cleanly from the built wheel
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          /tmp/fresh/bin/python -c "import web_router; print(web_router.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  ci-ok:
    name: CI
    if: always()
    needs: [lint, test, import-without-extras, hygiene, build]
    runs-on: ubuntu-latest
    steps:
      # One stable check to mark as required in branch protection. Off main it
      # is also the whole run: lint, types and unit tests on the oldest Python.
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required job did not succeed: ${{ join(needs.*.result, ' ') }}"
          exit 1

      - uses: actions/checkout@v7
        if: env.FULL != 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL != 'true'
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Lint, types and unit tests (Python 3.10)
        if: env.FULL != 'true'
        run: |
          uv sync --all-extras --dev
          make check
      - name: No credentials in tracked files
        if: env.FULL != 'true'
        run: bash scripts/check_credentials.sh
      - name: Lockfile and requirements files are in sync
        if: env.FULL != 'true'
        run: |
          uv lock --check
          uv export --no-hashes --no-emit-project --all-extras --no-dev -o /tmp/requirements.txt
          uv export --no-hashes --no-emit-project --all-extras --only-dev -o /tmp/requirements-dev.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt) \
            || { echo "::error::requirements.txt is stale. Run: make requirements"; exit 1; }
          diff -u <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.txt) \
            || { echo "::error::requirements-dev.txt is stale. Run: make requirements"; exit 1; }

      - name: All jobs succeeded
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "${{ join(needs.*.result, ' ') }}"
