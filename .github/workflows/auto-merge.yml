name: Auto-merge controller

# This workflow has access to repository secrets, so it must use trusted base
# code only. It never checks out or executes pull-request code.
on:
  # Repository secrets are required for fork PRs. Every step below uses trusted
  # base code and passes event data through environment variables.
  pull_request_target: # zizmor: ignore[dangerous-triggers] App credentials; trusted base only.
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile auto-merge
    if: >-
      github.repository == 'Nimbleway/webrouter' &&
      (github.event.pull_request.base.ref == 'main' ||
      (github.event.action == 'edited' && github.event.changes.base.ref.from == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Create the repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.WEBROUTER_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.WEBROUTER_AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Check out trusted default-branch policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch the live pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pull-request.json"

      - name: Read authenticated Qodo state
        id: qodo-state
        env:
          ACTION: ${{ github.event.action }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EVENT_ACTOR_ID: ${{ github.event.sender.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          head="$(jq -er '.head.sha' "$RUNNER_TEMP/pull-request.json")"
          gh api "repos/$REPO/commits/$head/status" > "$RUNNER_TEMP/status.json"
          qodo_status="$(jq -r --arg creator "$APP_SLUG[bot]" \
            '[.statuses[] | select(.context == "qodo-ready" and .creator.login == $creator)] | first | .state // ""' \
            "$RUNNER_TEMP/status.json")"

          label_actor_id="$EVENT_ACTOR_ID"
          if [[ "$ACTION" == "ready_for_review" ]]; then
            gh api --paginate --slurp "repos/$REPO/issues/$PR/events?per_page=100" \
              > "$RUNNER_TEMP/issue-events.json"
            label_actor_id="$(jq -r \
              '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "Qodo approved")] | last | select(.event == "labeled") | .actor.id // ""' \
              "$RUNNER_TEMP/issue-events.json")"
          fi

          printf 'label-actor-id=%s\n' "$label_actor_id" >> "$GITHUB_OUTPUT"
          printf 'status=%s\n' "$qodo_status" >> "$GITHUB_OUTPUT"

      - name: Decide the transition
        id: policy
        env:
          ACTION: ${{ github.event.action }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PREVIOUS_BASE: ${{ github.event.changes.base.ref.from }}
          QODO_LABEL_ACTOR_ID: ${{ steps.qodo-state.outputs.label-actor-id }}
          QODO_STATUS: ${{ steps.qodo-state.outputs.status }}
        run: |
          python3 scripts/auto_merge_policy.py \
            --action "$ACTION" \
            --event-actor-id "$QODO_LABEL_ACTOR_ID" \
            --event-head "$EVENT_HEAD" \
            --event-label "$EVENT_LABEL" \
            --previous-base "$PREVIOUS_BASE" \
            --pull-request "$RUNNER_TEMP/pull-request.json" \
            --qodo-status "$QODO_STATUS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reset or hold the current head
        if: steps.policy.outputs.decision == 'reset' || steps.policy.outputs.decision == 'hold'
        env:
          DECISION: ${{ steps.policy.outputs.decision }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD: ${{ steps.policy.outputs.head }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.policy.outputs.reason }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi

          if [[ "$DECISION" == "reset" ]] \
            && jq -e '.labels[]? | select(.name == "Qodo approved")' "$RUNNER_TEMP/pull-request.json" >/dev/null; then
            gh api --method DELETE "repos/$REPO/issues/$PR/labels/Qodo%20approved"
          fi

          gh api --method POST "repos/$REPO/statuses/$HEAD" \
            -f state=pending \
            -f context=qodo-ready \
            -f description="Waiting: $REASON" \
            -f target_url="$RUN_URL"

      - name: Disable auto-merge after leaving main
        if: steps.policy.outputs.decision == 'cleanup'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi

      - name: Record Qodo approval on the current draft head
        if: steps.policy.outputs.decision == 'approve'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD: ${{ steps.policy.outputs.head }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$HEAD" \
            -f state=success \
            -f context=qodo-ready \
            -f description="Qodo approved the current draft head" \
            -f target_url="$RUN_URL"

      - name: Re-fetch the ready candidate
        if: steps.policy.outputs.decision == 'ready'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pull-request-ready.json"

      - name: Re-read authenticated Qodo state
        if: steps.policy.outputs.decision == 'ready'
        id: qodo-state-ready
        env:
          ACTION: ${{ github.event.action }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EVENT_ACTOR_ID: ${{ github.event.sender.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          head="$(jq -er '.head.sha' "$RUNNER_TEMP/pull-request-ready.json")"
          gh api "repos/$REPO/commits/$head/status" > "$RUNNER_TEMP/status-ready.json"
          qodo_status="$(jq -r --arg creator "$APP_SLUG[bot]" \
            '[.statuses[] | select(.context == "qodo-ready" and .creator.login == $creator)] | first | .state // ""' \
            "$RUNNER_TEMP/status-ready.json")"

          label_actor_id="$EVENT_ACTOR_ID"
          if [[ "$ACTION" == "ready_for_review" ]]; then
            gh api --paginate --slurp "repos/$REPO/issues/$PR/events?per_page=100" \
              > "$RUNNER_TEMP/issue-events-ready.json"
            label_actor_id="$(jq -r \
              '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "Qodo approved")] | last | select(.event == "labeled") | .actor.id // ""' \
              "$RUNNER_TEMP/issue-events-ready.json")"
          fi

          printf 'label-actor-id=%s\n' "$label_actor_id" >> "$GITHUB_OUTPUT"
          printf 'status=%s\n' "$qodo_status" >> "$GITHUB_OUTPUT"

      - name: Verify the ready candidate
        if: steps.policy.outputs.decision == 'ready'
        id: verified
        env:
          ACTION: ${{ github.event.action }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PREVIOUS_BASE: ${{ github.event.changes.base.ref.from }}
          QODO_LABEL_ACTOR_ID: ${{ steps.qodo-state-ready.outputs.label-actor-id }}
          QODO_STATUS: ${{ steps.qodo-state-ready.outputs.status }}
        run: |
          python3 scripts/auto_merge_policy.py \
            --action "$ACTION" \
            --event-actor-id "$QODO_LABEL_ACTOR_ID" \
            --event-head "$EVENT_HEAD" \
            --event-label "$EVENT_LABEL" \
            --previous-base "$PREVIOUS_BASE" \
            --pull-request "$RUNNER_TEMP/pull-request-ready.json" \
            --qodo-status "$QODO_STATUS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Mark Qodo ready and arm squash auto-merge
        if: steps.verified.outputs.decision == 'ready'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD: ${{ steps.verified.outputs.head }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$HEAD" \
            -f state=pending \
            -f context=qodo-ready \
            -f description="Controller is arming squash auto-merge" \
            -f target_url="$RUN_URL"

          auto_method="$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')"
          if [[ -n "$auto_method" && "$auto_method" != "SQUASH" ]]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi
          if [[ "$auto_method" != "SQUASH" ]] \
            && ! gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD"; then
            gh api --method POST "repos/$REPO/statuses/$HEAD" \
              -f state=error \
              -f context=qodo-ready \
              -f description="Controller could not arm auto-merge" \
              -f target_url="$RUN_URL"
            exit 1
          fi

          gh api --method POST "repos/$REPO/statuses/$HEAD" \
            -f state=success \
            -f context=qodo-ready \
            -f description="Qodo approved the current head" \
            -f target_url="$RUN_URL"
