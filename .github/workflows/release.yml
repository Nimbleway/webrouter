name: Release
run-name: Release ${{ inputs.tag }}

# Builds a release tag and publishes it to PyPI through trusted publishing:
# PyPI accepts the upload because it comes from this workflow in the `pypi`
# environment, so no token is stored anywhere. The build job runs the source
# with no special access; the publish job runs nothing from the source, only
# uploads the built files, after a maintainer approves the `pypi` deployment.
#
# Run it on the tag itself, so the workflow file comes from the release and the
# `pypi` environment (deployments from `v*` tags only) accepts it:
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.10.1
        required: true
        type: string

permissions: {}

concurrency:
  # One run per tag: a second dispatch waits instead of reaching the approval twice.
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      RUN_REF: ${{ github.ref }}
    steps:
      - name: Tag must look like vX.Y.Z, and the run must be on that tag
        # Plain releases only: no pre-release suffixes and no leading zeros, so
        # the tag, __version__ and the built file names are the same string.
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          if [ "$RUN_REF" != "refs/tags/$TAG" ]; then
            echo "::error::run this on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG (ran on $RUN_REF)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Both checks run before any build tool touches the checked-out code.
      - name: Tag must point at a commit on main
        # Full ref names, so a tag named like a branch can't stand in for main.
        run: |
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" refs/remotes/origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }

      - name: Tag must match __version__
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/web_router/_version.py)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::$TAG does not match __version__ $version"
            exit 1
          fi
          echo "Building webrouter $version"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers, deployments from main only. PyPI's trusted publisher
    # for webrouter names this repository, this workflow and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/webrouter/
    permissions:
      id-token: write # the OIDC token PyPI checks; nothing else
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a version not above every version on PyPI
        # Fails closed on any answer but 200 (versions listed) or 404 (no
        # project yet, the first release).
        run: |
          version="${TAG#v}"
          code=$(curl -sS -o project.json -w '%{http_code}' https://pypi.org/pypi/webrouter/json) || code=000
          case "$code" in
            404) echo "webrouter is not on PyPI yet: this is its first release"; exit 0 ;;
            200) ;;
            *) echo "::error::PyPI returned $code"; exit 1 ;;
          esac
          # Only plain X.Y.Z releases are compared: this workflow publishes no others,
          # and a pre-release someone else uploaded must not block the final one.
          versions=$(jq -r '.releases | keys[]' project.json | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV || true)
          highest=$(echo "$versions" | tail -1)
          [ -n "$highest" ] || { echo "No plain release on PyPI yet"; exit 0; }
          echo "Highest on PyPI: $highest"
          if [ "$version" = "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::$version is not above $highest"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Built files must be exactly this version of webrouter
        # Reads the files only; nothing from them runs.
        run: |
          version="${TAG#v}"
          sdist="dist/webrouter-$version.tar.gz"
          wheels=(dist/webrouter-"$version"-*.whl)
          find dist -type f -print
          built=$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)
          [ "$built" -eq 2 ] || { echo "::error::expected one sdist and one wheel"; exit 1; }
          [ -f "$sdist" ] || { echo "::error::no $sdist"; exit 1; }
          [ -f "${wheels[0]}" ] || { echo "::error::no webrouter-$version wheel"; exit 1; }
          meta=$(unzip -p "${wheels[0]}" "webrouter-$version.dist-info/METADATA")
          printf '%s\n' "$meta" | grep -qx "Name: webrouter" || { echo "::error::wheel is not webrouter"; exit 1; }
          printf '%s\n' "$meta" | grep -qx "Version: $version" || { echo "::error::wheel version is not $version"; exit 1; }
          echo "dist matches webrouter $version"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
