name: Changelog

# Every pull request with a change users would notice adds a fragment,
# changelog.d/<name>.<type>.md (see changelog.d/README.md), whatever branch it
# targets. A PR with nothing to note (CI, docs, tests, refactors, release bumps)
# carries the `skip-changelog` label instead. CHANGELOG.md itself is written at
# release by `make changelog`, so a PR that edits it is pointed at a fragment.
# The fragments' format is checked by tests/test_changelog_fragments.py in CI.
# Reads the PR's file list through the API; nothing from the PR is checked out or run.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: CHANGELOG updated
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - name: The PR adds a changelog fragment and leaves CHANGELOG.md alone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | {status, filename, previous_filename} | @json' > files.jsonl
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          how = (
              "add changelog.d/<name>.<type>.md with your entry (see changelog.d/README.md), "
              "or, if users would not notice the change, the skip-changelog label "
              "(on a fork PR, ask a maintainer to add it)."
          )
          with open("files.jsonl") as files:
              rows = [json.loads(line) for line in files if line.strip()]
          # GitHub caps this endpoint at 3,000 files, even with pagination.
          if len(rows) != int(os.environ["EXPECTED_FILES"]):
              sys.exit("::error::Incomplete PR file list; cannot verify changelog changes.")
          if any("CHANGELOG.md" in (row["filename"], row.get("previous_filename")) for row in rows):
              sys.exit(f"::error::CHANGELOG.md is written at release from fragments. Undo your edit to it and {how}")
          # The name only; tests/test_changelog_fragments.py checks the type and the text.
          fragment = re.compile(r"changelog\.d/[a-z0-9][a-z0-9_-]*\.[a-z]+\.md")
          fragments = [
              row["filename"] for row in rows
              if row["status"] in ("added", "renamed", "copied") and fragment.fullmatch(row["filename"])
          ]
          if not fragments:
              sys.exit(f"::error::No changelog fragment: {how}")
          print("Fragments:", ", ".join(fragments))
          PY
