name: Changelog

# Every pull request notes its user-visible change under `## [Unreleased]` in
# CHANGELOG.md (see CONTRIBUTING.md). A PR with nothing to note (CI, docs,
# tests, refactors, release bumps) carries the `skip-changelog` label instead.
# Reads the PR's file list and CHANGELOG.md through the API; nothing from the
# PR is checked out or run.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: CHANGELOG updated
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - name: New CHANGELOG lines must sit under ## [Unreleased]
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | select(.filename == "CHANGELOG.md") | {changed: true, patch: (.patch // "")}' > file.json
          gh api "repos/$REPO/contents/CHANGELOG.md?ref=$HEAD_SHA" -H "Accept: application/vnd.github.raw" > CHANGELOG.md
          python3 - <<'PY'
          import json, re, sys

          hint = "or label the PR skip-changelog if there is nothing to note."
          raw = open("file.json").read().strip()
          if not raw:
              sys.exit(f"::error::Add your change under ## [Unreleased] in CHANGELOG.md, {hint}")
          patch = json.loads(raw.splitlines()[0])["patch"]
          if not patch:
              print("::warning::CHANGELOG.md changed, but GitHub sent no diff (too large); not checked.")
              sys.exit(0)
          lines = open("CHANGELOG.md").read().splitlines()
          start = next((i for i, l in enumerate(lines, 1) if l.strip() == "## [Unreleased]"), None)
          if start is None:
              sys.exit("::error::CHANGELOG.md has no ## [Unreleased] heading.")
          end = next((i for i, l in enumerate(lines, 1) if i > start and l.startswith("## ")), len(lines) + 1)

          # A "+" line that replaces a "-" line just above it is an edit (a typo fix in an
          # old entry), not a new entry, so it may sit under a released version.
          inside, outside, line, removed = 0, [], 0, 0
          for row in patch.splitlines():
              hunk = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)", row)
              if hunk:
                  line, removed = int(hunk.group(1)), 0
                  continue
              if row.startswith("\\"):
                  continue
              if row.startswith("-"):
                  removed += 1
                  continue
              text = row[1:].strip()
              if row.startswith("+"):
                  edit = removed > 0
                  removed = max(removed - 1, 0)
                  if text and not start < line < end and not edit:
                      outside.append(line)
                  elif text.startswith("- ") and start < line < end:
                      inside += 1
              else:
                  removed = 0
              line += 1
          if outside:
              sys.exit(f"::error::CHANGELOG.md lines {outside} were added under a released version; move them under ## [Unreleased].")
          if not inside:
              sys.exit(f"::error::Add your change as a '- ' entry under ## [Unreleased] in CHANGELOG.md, {hint}")
          print(f"{inside} new line(s) under ## [Unreleased]")
          PY
