name: Docs site

# Publishes the docs site. The Data APIs pages are generated from the vendor
# catalog (src/web_router/data/vendors) and never committed: this builds docs/
# plus those pages and force-pushes the result, alone, to the `docs-site`
# branch, which the docs host deploys from. Its history is disposable: every run
# replaces it with one commit built from main.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/web_router/data/vendors/**"
      - "src/web_router/constants_vendors.py"
      - "src/web_router/vendors/**"
      - "scripts/data_api_*.py"
      - "scripts/vendors.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  publish:
    name: Build and publish
    # Only main is published, also when the workflow is run by hand on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Build the site
        run: uv run python -m scripts.data_api_docs --out "$RUNNER_TEMP/site/docs"

      - name: Push to the docs-site branch
        working-directory: ${{ runner.temp }}/site
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git init -q -b docs-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -q -m "docs: site built from ${SOURCE_SHA}"
          git push -q --force "$REPO_URL" docs-site
