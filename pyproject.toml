[project]
name = "web-router"
dynamic = ["version"]
description = "A provider-agnostic router for web search and page-extraction APIs (Nimble, Exa, Tavily, Brave, Oxylabs, Bright Data, ...)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/web_router/evals/prompts/LICENSE-simple-evals"]
requires-python = ">=3.10"
authors = [
    { name = "Nimble" },
]
keywords = [
    "search",
    "web-search",
    "extract",
    "scraping",
    "router",
    "nimble",
    "tavily",
    "you.com",
    "exa",
    "brave",
    "parallel",
    "perplexity",
    "linkup",
    "oxylabs",
    "brightdata",
    "firecrawl",
    "jina",
    "llm",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0,<3",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# Extras name the methods you call, not the backends behind them: you ask for
# `search`, and every provider that can serve a search comes with it. Routing
# is the point of the package -- pinning the install to one vendor works
# against it, and picking a backend is a runtime decision (`provider=`) rather
# than an install-time one.
#
# nimble-python and tavily-python are those two providers' SDKs; the other six
# search backends have none and talk to their REST APIs over httpx.
search = [
    "nimble-python>=1.5.0,<2",
    "tavily-python>=0.5.0",
    "httpx>=0.27",
]
# The same three, for different reasons: Nimble and Tavily serve extract through
# the SDKs they already ship, and the four extract-only backends -- Firecrawl,
# Oxylabs, Bright Data and Jina Reader -- publish no SDK and need httpx alone.
# Written out rather than aliased to `search`, so either method can shed a
# dependency without dragging the other along.
extract = [
    "nimble-python>=1.5.0,<2",
    "tavily-python>=0.5.0",
    "httpx>=0.27",
]
# Agentic research: a backend reasons over several turns and answers in
# minutes. Nimble goes through the SDK it already ships; Parallel, Perplexity,
# Linkup and You.com publish no Python SDK worth the dependency for the slim use
# made of them, so httpx again.
research = [
    "nimble-python>=1.5.0,<2",
    "httpx>=0.27",
]
# One question, answered in one call with a written answer and its sources.
# Every answer backend publishes no SDK worth the dependency for one POST, so
# httpx alone.
answer = [
    "httpx>=0.27",
]
# Page actions on an open browser session -- goto, snapshot, click and the rest
# -- driven over the session's CDP URL. Only driving a session needs
# Playwright: opening one on a vendor takes httpx, which `all` installs, and on
# `local` the standard library. Pinned to a tested minor because the snapshot
# refs resolve through Playwright's `aria-ref=` selector engine, which the
# driver registers but does not document; tests/test_browser_actions.py fails
# if a release drops it. No `playwright install` is needed -- the
# browser is the session's, reached over CDP. Pillow converts a screenshot a
# vendor's browser returns as JPEG although PNG was asked for (Anchor does).
browser = [
    "playwright>=1.63,<1.64",
    "pillow>=10",
]
# The one extra not named after a method -- see EXTRA_MCP in constants.py. It
# installs the stdio MCP server, which exposes the methods above to an agent
# rather than adding one of its own.
# Not `browser`: Playwright is a large install most MCP users never drive. The
# server lists its browser_* tools only when it is present, so
# `web-router[mcp,browser]` is what turns them on.
mcp = [
    "web-router[search,extract,research,answer]",
    "mcp>=2.2,<3",
    # The server's entry point loads the project .env, so keys reach it
    # without being exported; the library itself never reads dotfiles.
    "python-dotenv>=1.0",
]
# Also not a method: the built-in judges for `evaluate()`, which synthesize an
# answer from each search backend's results and grade it. OpenAI's is the
# default because the vendored SimpleQA grader prompt is theirs; Anthropic's is
# there so a GPT-family system under test is not graded by its own family.
# Bring your own `Judge` subclass and this extra is not needed.
evals = [
    "web-router[search]",
    "openai>=1.0,<4",
    "anthropic>=1.8,<2",
    # SealQA is published as Parquet; read only inside Dataset.sealqa().
    "pyarrow>=15",
]
# Not a method either: LangChain tools over search and extract, for an agent
# built on LangChain rather than one that speaks MCP. langchain-core is all the
# tools need -- the agent loop and the model are the caller's own install.
langchain = [
    "web-router[search,extract]",
    "langchain-core>=1.0,<2",
]
# The second exception to the method rule (EXTRA_AWS in constants.py): the
# backends reached through an AWS account -- AgentCore Web Search so far -- sign
# their requests with botocore, a large install that a search user who never
# touches AWS should not carry. Only signing is used, so no boto3.
aws = [
    "web-router[search]",
    "botocore>=1.35",
]
all = ["web-router[search,extract,research,answer,browser,aws]"]

[project.scripts]
web-router-mcp = "web_router.mcp.server:main"

[project.urls]
Repository = "https://github.com/Nimbleway/webrouter"
Issues = "https://github.com/Nimbleway/webrouter/issues"
Changelog = "https://github.com/Nimbleway/webrouter/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "python-dotenv>=1.0",
    "ruff>=0.6",
]
# benchmarks/agent/: the same agent on its platform's built-in web search and
# on web-router's tools -- Claude on Managed Agents, or OpenAI on the Responses
# API, whose SDK the `evals` extra already installs. Not `dev`, so CI and a
# plain `make install` never pull the Anthropic SDK; run it with
# `uv run --all-extras --group agent-bench`.
agent-bench = [
    "anthropic>=1.8,<2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The one place the version lives: RELEASING.md bumps _version.py and the
# publish workflow checks the tag against it, so the build must read the same
# file rather than carry a second copy that drifts.
[tool.hatch.version]
path = "src/web_router/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/web_router"]

[tool.hatch.build.targets.sdist]
include = ["src/web_router", "tests", "scripts", "contracts", "README.md", "CHANGELOG.md"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# C901 and PLR0915 bound a function's size; tests/test_shape.py bounds a file's,
# which ruff cannot. Functions over either limit today carry a `# noqa`.
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "C901", "PLR0915"]
ignore = ["B008"]

[tool.ruff.lint.mccabe]
# McCabe's own threshold, and ruff's default.
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["web_router", "scripts"]

[tool.mypy]
python_version = "3.10"
files = ["src/web_router"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: hits a real provider API; requires credentials and network",
    "browser: launches a real local browser; skips when none is installed",
]

[tool.coverage.run]
source = ["src/web_router"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
